# =============================================================================
# GHCR Publish Workflow (forks)
#
# Runs the test suite, then builds and pushes the image to the GitHub
# Container Registry of the repository it runs in:
#   ghcr.io/<owner>/obsidian-git-backup:latest       pushes to main
#   ghcr.io/<owner>/obsidian-git-backup:<branch>     every branch
#   ghcr.io/<owner>/obsidian-git-backup:sha-<short>  every push
#
# Needs no secrets: it authenticates with the workflow's GITHUB_TOKEN.
# Skipped in the upstream repository, which publishes to Docker Hub
# (docker-publish.yml).
#
# The package is private on first publish. Either make it public (package
# settings on GitHub) or `docker login ghcr.io` on the host that pulls it,
# with a token that has read:packages.
#
# linux/amd64 only: building obsidian-headless's native modules for arm64
# under QEMU is slow. Add linux/arm64 to `platforms` if needed.
# =============================================================================

name: GHCR Publish

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository_owner != 'benedicteb'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suite
        run: sh tests/run.sh

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/obsidian-git-backup
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
